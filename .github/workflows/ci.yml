name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Gate the heavy jobs: skip them when every changed file is Claude Code
  # project config (.claude/**). Done with a job-level gate rather than
  # workflow paths-ignore so the required ci-pass check still reports.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Filter Claude-only changes
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if files=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null) && [ -n "$files" ]; then
            if ! printf '%s\n' "$files" | grep -qvE '^\.claude/'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate plugin structure
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Validate plugins
        run: bash .github/scripts/validate-plugins.sh
      - name: Check CI/validate-all parity
        run: bash .github/scripts/check-ci-parity.sh

  test:
    name: Plugin tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          sudo sh -c 'curl -sSL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 > /usr/local/bin/shfmt'
          sudo chmod +x /usr/local/bin/shfmt
      - name: Run tests
        run: bash test.sh

  validate-frontmatter:
    name: Validate frontmatter
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate command and skill frontmatter
        run: bash .github/scripts/validate-frontmatter.sh

  lint-markdown:
    name: Lint markdown
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install rumdl
        run: |
          curl -sSL https://github.com/rvben/rumdl/releases/download/v0.2.69/rumdl-v0.2.69-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv rumdl /usr/local/bin/
      - name: Run rumdl
        run: rumdl check .

  lint-shell:
    name: Lint shell scripts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find and lint shell scripts
        run: bash .github/scripts/lint-shell.sh

  ci-pass:
    name: ci-pass
    needs: [changes, validate, test, validate-frontmatter, lint-markdown, lint-shell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream results
        run: |
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ] || exit 1
          [ "${{ contains(needs.*.result, 'cancelled') }}" = "false" ] || exit 1
