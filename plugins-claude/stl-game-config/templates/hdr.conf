# HDR Settings Template
# Uncomment lines to enable HDR (only if KDE HDR is enabled AND game supports it)

# === HDR via Proton (DX12 games) ===
# PROTON_ENABLE_HDR="1"
# ENABLE_HDR_WSI="1"

# === HDR via DXVK (DX11 games) ===
# DXVK_HDR="1"

# === KDE HDR Prerequisites (one-time setup) ===
# 1. Install vk-hdr-layer: paru -S vk-hdr-layer-kwin6-git
# 2. Enable KDE HDR: System Settings → Display → Enable HDR
# 3. Calibrate peak brightness to match monitor spec

# === Troubleshooting ===
# - HDR missing: Install vk-hdr-layer-kwin6-git, verify KDE HDR enabled
# - HDR too dark: Lower KDE peak brightness to match monitor spec
# - HDR washed out: Raise KDE SDR brightness
# - Stuttering with HDR: This is a KDE+HDR issue - recommend disabling HDR for this game