# HDR Settings Template
# Uncomment only if the compositor has HDR enabled AND the game supports it.
#
# Which route applies depends on the translation layer the game actually uses,
# not on the game's era:
#
#   D3D9/10/11 -> DXVK  -> DXVK_HDR
#   D3D12      -> VKD3D -> gamescope's WSI layer (see gamescope.conf)
#
# DXVK only handles D3D9-11. On a DX12-only title DXVK_HDR is inert - harmless
# to leave set for consistency with other titles, but it is not what lights up
# HDR there.

# === HDR via DXVK (DX9/DX10/DX11 games) ===
# DXVK_HDR="1"

# === HDR via gamescope (DX12/VKD3D games) ===
# Goes in the game's customvars, paired with --hdr-enabled in GAMESCOPE_ARGS.
# See gamescope.conf - both are required, neither alone does anything.
# ENABLE_GAMESCOPE_WSI="1"

# === DO NOT USE: the legacy winewayland / vk-hdr-layer route ===
# These predate the gamescope path and conflict with it. PROTON_ENABLE_WAYLAND
# puts wine back on winewayland.drv; ENABLE_HDR_WSI loads the standalone
# vk-hdr-layer shim, and stacking that under gamescope's own WSI layer invites
# conflicts. PROTON_ENABLE_HDR only sets DXVK_HDR=1, so it does nothing for a
# DX12 title. Listed here so they are recognised and removed, never added:
#
#   PROTON_ENABLE_WAYLAND   <- do not set
#   PROTON_ENABLE_HDR       <- do not set
#   ENABLE_HDR_WSI          <- do not set

# === Prerequisites (one-time, compositor setup) ===
# 1. Enable HDR in the compositor's display settings
#    (KDE: System Settings -> Display & Monitor -> Enable HDR)
# 2. Calibrate peak brightness to match the monitor's spec
# 3. Confirm gamescope was built with HDR support: gamescope --help | grep hdr
#
# The standalone vk-hdr-layer package is NOT needed for the gamescope route.

# === Troubleshooting ===
# - HDR missing on a DX12 title: check ENABLE_GAMESCOPE_WSI=1 is in customvars
#   AND --hdr-enabled is in GAMESCOPE_ARGS
# - HDR missing on a DX11 title: DXVK_HDR=1, and confirm the game has its own
#   HDR toggle turned on in its video options
# - HDR too dark: lower the compositor's peak-brightness value to the panel spec
# - HDR washed out: raise the compositor's SDR brightness
# - Stuttering only with HDR: drop HDR for that title and re-test
