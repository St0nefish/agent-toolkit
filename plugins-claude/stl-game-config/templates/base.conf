# Base Template - Always Safe Defaults
# Include this for all games.
#
# Every key below is a real STL config field. Before adding one, confirm it
# exists: `grep -c '<FIELD>' "$(command -v steamtinkerlaunch)"`. A key STL does
# not recognise is silently ignored, so a typo looks like a setting that simply
# does not work.

# --- Proton ---
# USEPROTON takes a compatibility tool's INTERNAL NAME, never a boolean.
# Valid values look like "GE-Proton11-5-x86_64", "proton-cachyos-...", or a
# Steam builtin such as "proton-8.0-5d". Read the current name from
# `stl-info.sh -j -s | jq -r '.system.proton.compatibilitytools_d'` - do not
# copy one from another game's config without checking it still exists.
# USEPROTON="GE-Proton..."

PROTON_FORCE_LARGE_ADDRESS_AWARE="1"
PROTON_USE_WINED3D="0"
PROTON_NO_ESYNC="0"
PROTON_NO_FSYNC="0"

# --- NVIDIA ---
# Correct for modern DX12/DLSS titles. Retro titles want the inverse
# (NVAPI off, GPU hidden) - see api.conf. On AMD/Intel these are inert.
PROTON_ENABLE_NVAPI="1"
PROTON_HIDE_NVIDIA_GPU="0"

# --- Rendering ---
DXVK_ASYNC="1"
# FSR only engages when the game runs at less than native resolution; harmless
# at native, so it is safe to leave on.
WINE_FULLSCREEN_FSR="1"

# --- Wrappers and overlay ---
USEGAMEMODERUN="1"
# MangoHud via STL. Set this to 0 for any gamescope title and put --mangoapp in
# GAMESCOPE_ARGS instead, so gamescope owns the overlay. Never pair it with
# USEMANGOAPP=1, which wedges STL on exit under gamescope (upstream #1153).
USEMANGOHUD="1"

# --- STL behaviour ---
# 0 skips STL's config popup on launch - useful for agent-driven setup.
WAITEDITOR="0"
