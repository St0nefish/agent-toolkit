# Custom Variables Template
# For environment variables not built into STL
# Create at: ~/.config/steamtinkerlaunch/gamecfgs/customvars/{APPID}.conf

# Force GPU selection (useful for multi-GPU or iGPU systems)
# DXVK_FILTER_DEVICE_NAME="NVIDIA"
# VKD3D_FILTER_DEVICE_NAME="NVIDIA"

# VKD3D shader cache (DX12 games - reduces compilation stutters)
# VKD3D_SHADER_CACHE="1"
# VKD3D_SHADER_CACHE_PATH="$HOME/.cache/vkd3d-proton"

# Retro game settings
# PULSE_LATENCY_MSEC="60"
# DXVK_FRAME_RATE="120"