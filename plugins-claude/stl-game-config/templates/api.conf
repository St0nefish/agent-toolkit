# API Settings Template
# Uncomment the block matching your game's graphics API

# === DX12 + Ray Tracing ===
# STL_VKD3D_CONFIG="dxr"
# USERAYTRACING="1"
# USEDLSS="1"

# === DX12 (no RT) ===
# STL_VKD3D_CONFIG="none"
# USERAYTRACING="0"
# USEDLSS="1"

# === DX11 / Vulkan ===
# STL_VKD3D_CONFIG="none"
# USERAYTRACING="0"
# USEDLSS="1"
# DXVK_HDR="1"

# === DX9 (Retro) ===
# taskset -c 0-3 %command%
# WINE_CPU_TOPOLOGY="4:2"
# PULSE_LATENCY_MSEC="60"
# DXVK_FRAME_RATE="120"
# PROTON_NO_ESYNC="1"

# === Critical Notes ===
# - VKD3D_CONFIG="dxr" is REQUIRED for DX12 RT detection
# - USERAYTRACING=1 BREAKS DX11/Vulkan games (set to 0)